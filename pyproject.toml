[project]
name = "cnn-pytorch"
version = "0.1.0"
description = "Un mini-NAS PyTorch construit pas à pas : du gradient à la main à la mesure du coût d'un CNN"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "torch>=2.5",
    "torchvision>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16,<0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# E/F : erreurs de base ; I : tri des imports ; UP : syntaxe moderne ;
# B : bugs probables ; SIM : simplifications ; RUF : règles propres à Ruff.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# E501 : les longues lignes sont des docstrings et des commentaires en français.
ignore = ["E501"]
